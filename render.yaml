services:
  - type: web
    name: debug-dojo-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed_db.py
    startCommand: gunicorn "run:app" --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
